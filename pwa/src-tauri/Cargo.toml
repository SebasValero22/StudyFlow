[package]
name = "studyflow"
version = "0.1.0"
description = "StudyFlow Desktop - Academic Life OS & Deep Work Focus Engine"
authors = ["Sebastian Valero"]
license = "MIT"
repository = "https://github.com/SebasValero22/StudyFlow"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "studyflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.7.0"
