<div class="audio-dock" [class.compact]="isCompact">
  <button class="dock-play-btn" (click)="togglePlay()" [title]="isPlaying ? 'Pause ambient audio' : 'Play ambient audio'">
    @if (isPlaying) {
      <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    } @else {
      <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    }
  </button>
  
  @if (!isCompact) {
    <div class="dock-body">
      <div class="dock-stream-row">
        <select class="dock-stream-select" (change)="changeStream($event)" [value]="currentStream?.id || streams[0].id">
          <option *ngFor="let stream of streams" [value]="stream.id">
            {{ stream.icon }} {{ stream.name }}
          </option>
        </select>
      </div>
      
      <div class="dock-volume-row">
        <span class="vol-icon">🔈</span>
        <input type="range" class="dock-volume-slider" min="0" max="1" step="0.05" [value]="volume" (input)="changeVolume($event)" title="Volume">
        <span class="vol-icon">🔊</span>
      </div>
    </div>
  }
</div>
