<div class="tasks-container">
  <h2>Tasks</h2>

  <div *ngIf="error" class="error-message">{{ error }}</div>

  <div class="task-form">
    <h3>Add New Task</h3>
    <div class="input-group">
      <input type="text" [(ngModel)]="newTask.title" placeholder="Task Title">
      <input type="text" [(ngModel)]="newTask.description" placeholder="Description">
      <select [(ngModel)]="newTask.lifeAreaId">
        <option value="0" disabled selected>Select Life Area</option>
        <option *ngFor="let subject of subjects" [value]="subject.lifeAreaId">
          {{ subject.name }}
        </option>
      </select>
    </div>
    <div class="input-group">
      <input type="date" [(ngModel)]="newTask.start_date">
      <input type="date" [(ngModel)]="newTask.due_date">
      <select [(ngModel)]="newTask.priority">
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
      </select>
      <button (click)="isEditing ? updateTask() : addTask()">{{ isEditing ? 'Update Task' : 'Add Task' }}</button>
      <button *ngIf="isEditing" (click)="cancelEdit()" style="background-color: #bdc3c7; margin-left: 10px;">Cancel</button>
    </div>
  </div>

  <div class="task-filters">
    <label>Filter by Life Area:</label>
    <select [(ngModel)]="selectedSubjectId" (ngModelChange)="onFilterChange()">
      <option [ngValue]="null">All Life Areas</option>
      <option *ngFor="let s of subjects" [ngValue]="s.lifeAreaId">
        {{ s.name }}
      </option>
    </select>
  </div>

  <div class="kanban-board" cdkDropListGroup>
    <!-- Backlog Column -->
    <div class="kanban-column">
      <div class="kanban-header-row" style="display: flex; justify-content: space-between; align-items: center;">
        <h3>Someday</h3>
        <button (click)="autoPlanWeek()" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8rem;">✨ Auto-Plan</button>
      </div>
      <div class="task-list"
           cdkDropList
           #backlogList="cdkDropList"
           [cdkDropListData]="backlogTasks"
           (cdkDropListDropped)="drop($event, 'backlog')">
        <div class="task-card" *ngFor="let task of backlogTasks" cdkDrag [ngStyle]="{'border-left': '5px solid ' + getSubjectColor(task.lifeAreaId)}">
          <div class="task-header">
            <span class="task-title">{{ task.title }}</span>
            <div class="task-actions">
              <button (click)="editTask(task)">✎</button>
              <button (click)="deleteTask(task.taskId)">✕</button>
            </div>
          </div>
          <div class="task-desc" *ngIf="task.description">{{ task.description }}</div>
        </div>
      </div>
    </div>

    <!-- Today Column -->
    <div class="kanban-column">
      <h3>Today</h3>
      <div class="task-list"
           cdkDropList
           #todayList="cdkDropList"
           [cdkDropListData]="todayTasks"
           (cdkDropListDropped)="drop($event, 'today')">
        <div class="task-card" *ngFor="let task of todayTasks" cdkDrag [ngStyle]="{'border-left': '5px solid ' + getSubjectColor(task.lifeAreaId)}">
          <div class="task-header">
            <span class="task-title">{{ task.title }}</span>
            <div class="task-actions">
              <button (click)="editTask(task)">✎</button>
              <button (click)="deleteTask(task.taskId)">✕</button>
            </div>
          </div>
          <div class="task-desc" *ngIf="task.description">{{ task.description }}</div>
        </div>
      </div>
    </div>

    <!-- Tomorrow Column -->
    <div class="kanban-column">
      <h3>Tomorrow</h3>
      <div class="task-list"
           cdkDropList
           #tomorrowList="cdkDropList"
           [cdkDropListData]="tomorrowTasks"
           (cdkDropListDropped)="drop($event, 'tomorrow')">
        <div class="task-card" *ngFor="let task of tomorrowTasks" cdkDrag [ngStyle]="{'border-left': '5px solid ' + getSubjectColor(task.lifeAreaId)}">
          <div class="task-header">
            <span class="task-title">{{ task.title }}</span>
            <div class="task-actions">
              <button (click)="editTask(task)">✎</button>
              <button (click)="deleteTask(task.taskId)">✕</button>
            </div>
          </div>
          <div class="task-desc" *ngIf="task.description">{{ task.description }}</div>
        </div>
      </div>
    </div>

    <!-- Later Column -->
    <div class="kanban-column">
      <h3>Later</h3>
      <div class="task-list"
           cdkDropList
           #laterList="cdkDropList"
           [cdkDropListData]="laterTasks"
           (cdkDropListDropped)="drop($event, 'later')">
        <div class="task-card" *ngFor="let task of laterTasks" cdkDrag [ngStyle]="{'border-left': '5px solid ' + getSubjectColor(task.lifeAreaId)}">
          <div class="task-header">
            <span class="task-title">{{ task.title }}</span>
            <span class="task-due">{{ task.due_date }}</span>
            <div class="task-actions">
              <button (click)="editTask(task)">✎</button>
              <button (click)="deleteTask(task.taskId)">✕</button>
            </div>
          </div>
          <div class="task-desc" *ngIf="task.description">{{ task.description }}</div>
        </div>
      </div>
    </div>

    <!-- Completed Column -->
    <div class="kanban-column completed-column">
      <h3>Completed</h3>
      <div class="task-list"
           cdkDropList
           #completedList="cdkDropList"
           [cdkDropListData]="completedTasks"
           (cdkDropListDropped)="drop($event, 'completed')">
        <div class="task-card" *ngFor="let task of completedTasks" cdkDrag [ngStyle]="{'border-left': '5px solid ' + getSubjectColor(task.lifeAreaId), 'opacity': '0.7'}">
          <div class="task-header">
            <span class="task-title" style="text-decoration: line-through;">{{ task.title }}</span>
            <div class="task-actions">
              <button (click)="deleteTask(task.taskId)">✕</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
