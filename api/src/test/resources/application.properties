# Test-classpath defaults: shadow main config so tests never touch Aiven.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MYSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
# Must mirror main: PhysicalNamingStrategyStandardImpl keeps camelCase @Column names
# (deletedAt/updatedAt/startDate) so @SQLRestriction and queries match prod.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false

studyflow.jwt.secret=test-only-secret-key-for-local-integration-tests-0123456789abcdef
studyflow.jwt.expiration-ms=3600000
studyflow.calendar.allow-private=true
