spring.application.name=StudyFlow_api
server.port=8888

# --- DATABASE (Aiven MySQL) ---
# Credentials are injected via environment variables. NEVER commit secrets.
# Required env vars: DB_URL, DB_USERNAME, DB_PASSWORD
# Render: set them in Dashboard > Environment.
# Local dev example (PowerShell):
#   $env:DB_URL="jdbc:mysql://<host>:<port>/defaultdb?ssl-mode=REQUIRED"
#   $env:DB_USERNAME="<user>"
#   $env:DB_PASSWORD="<password>"
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Nyra AI (Gemini) ---
nyra.gemini.key=${NYRA_GEMINI_KEY:MOCK_KEY}

# --- Security (JWT) ---
# Generate with: openssl rand -base64 64  (must be >= 32 bytes)
studyflow.jwt.secret=${JWT_SECRET}
studyflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# --- Calendar feeds ---
