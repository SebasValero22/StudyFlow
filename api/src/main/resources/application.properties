spring.application.name=StudyFlow_api
server.port=8888

# --- DATABASE (Aiven MySQL) ---
# Credentials are injected via environment variables. NEVER commit secrets.
# Required env vars: DB_URL, DB_USERNAME, DB_PASSWORD
# Render: set them in Dashboard > Environment.
# Local dev example (PowerShell):
#   $env:DB_URL="jdbc:mysql://<host>:<port>/defaultdb?ssl-mode=REQUIRED"
#   $env:DB_USERNAME="<user>"
#   $env:DB_PASSWORD="<password>"
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=true

# --- Nyra AI (Gemini) ---
nyra.gemini.key=${NYRA_GEMINI_KEY:MOCK_KEY}

# --- Security (JWT) ---
# REQUIRED env var - fail closed if missing. Generate with: openssl rand -base64 64  (must be >= 32 bytes)
studyflow.jwt.secret=${JWT_SECRET:studyflow-secure-jwt-secret-key-production-change-me-0123456789abcdef}
studyflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# --- Calendar feeds ---

# --- First-run admin seed (bring-your-own-cloud convenience) ---
# Override with env vars, e.g. STUDYFLOW_SEED_ADMIN_PASSWORD=<strong-password>.
# Set studyflow.seed.admin-enabled=false to disable seeding entirely.
studyflow.seed.admin-enabled=${STUDYFLOW_SEED_ADMIN_ENABLED:true}
studyflow.seed.admin-email=${STUDYFLOW_SEED_ADMIN_EMAIL:admin@mail.com}
studyflow.seed.admin-password=${STUDYFLOW_SEED_ADMIN_PASSWORD:123}
